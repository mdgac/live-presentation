<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>James Stag Quiz</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
html,body{
    margin:0;
    padding:0;
    background:#111;
    overflow:hidden;
    width:100%;
    height:100%;
}

#slide{
    width:100vw;
    height:100vh;
    object-fit:contain;
    display:block;
    background:black;
}

#loading{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-family:Arial;
    font-size:28px;
}
</style>

</head>

<body>

<div id="loading">Waiting for presenter...</div>

<img id="slide" style="display:none;">
<script>

document.body.addEventListener("click", () => {

    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    }

}, { once: true });

</script>
<script>

const { createClient } = supabase;

const client = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

console.log("Supabase client created");

const slide=document.getElementById("slide");
const loading=document.getElementById("loading");
const images = [];

for(let i = 1; i <= 27; i++){

    const img = new Image();
    img.src = `slides/Slide${i}.jpeg`;
    images.push(img);

}
function showSlide(number){

    slide.src=`slides/Slide${number}.jpeg`;

    slide.onload=()=>{

        loading.style.display="none";
        slide.style.display="block";

    }

}
async function loadSlide(){

    console.log("Loading slide...");

    const { data, error } = await client
        .from("presentation")
        .select("*");

    console.log("DATA:", data);
    console.log("ERROR:", error);

    if(data && data.length > 0){
        showSlide(data[0].current_slide);
    }

}

   

loadSlide();
    
client
  .channel("presentation")
  .on(
    "postgres_changes",
    {
      event: "UPDATE",
      schema: "public",
      table: "presentation"
    },
    (payload) => {
      showSlide(payload.new.current_slide);
    }
  )
  .subscribe();

document.addEventListener("keydown",e=>e.preventDefault());
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});

</script>

</body>
</html>
